<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wi-Fi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                         "Segoe UI", sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 28px;
            padding: 32px 26px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        .wifi-icon {
            font-size: 52px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #6e6e73;
            margin-bottom: 30px;
        }

        .info {
            text-align: left;
            background: #f5f5f7;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .label {
            font-size: 13px;
            color: #6e6e73;
            margin-bottom: 5px;
        }

        .value {
            font-size: 18px;
            font-weight: 600;
            word-break: break-word;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 16px;
            padding: 16px;
            margin-top: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            background: #007aff;
            color: white;
        }

        button:active {
            transform: scale(0.98);
        }

        .instructions {
            margin-top: 28px;
            text-align: left;
            color: #6e6e73;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="wifi-icon">📶</div>

    <h1>Welcome</h1>

    <div class="subtitle">
        Connect to our Wi-Fi
    </div>

    <div class="info">
        <div class="label">Wi-Fi Network</div>
        <div class="value" id="network">KK (2.4G)</div>
    </div>

    <div class="info">
        <div class="label">Password</div>
        <div class="value" id="password">020122K@Ki</div>
    </div>

    <button onclick="copyPassword()">
        Copy Password
    </button>

    <div class="instructions">
        <strong>iPhone</strong><br>
        Tap "Copy Password", then open
        Settings → Wi-Fi and select the network.
        Paste the password when prompted.
    </div>

</div>

<script>
function copyPassword() {
    const password =
        document.getElementById("password").textContent;

    navigator.clipboard.writeText(password).then(() => {

        const button = document.querySelector("button");

        button.textContent = "✓ Password Copied";

        setTimeout(() => {
            button.textContent = "Copy Password";
        }, 2000);

    });
}
</script>

</body>
</html>
