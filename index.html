<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>K&K Wi-Fi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont,
                         "SF Pro Display", "Segoe UI", sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .card {
            width: 100%;
            max-width: 390px;
            max-height: 100%;
            background: white;
            border-radius: 24px;
            padding: 20px 20px 18px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
        }

        .wifi-icon {
            font-size: 38px;
            line-height: 1;
            margin-bottom: 6px;
        }

        h1 {
            margin: 0;
            font-size: 25px;
            line-height: 1.15;
        }

        .subtitle {
            color: #6e6e73;
            font-size: 14px;
            margin: 5px 0 16px;
        }

        .info {
            text-align: left;
            background: #f5f5f7;
            border-radius: 14px;
            padding: 11px 14px;
            margin-bottom: 8px;
        }

        .label {
            font-size: 11px;
            color: #6e6e73;
            margin-bottom: 2px;
        }

        .value {
            font-size: 16px;
            font-weight: 600;
            word-break: break-word;
        }

        .password-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .password {
            flex: 1;
        }

        .small-button {
            border: 0;
            background: transparent;
            color: #007aff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 3px;
        }

        .main-button {
            width: 100%;
            border: 0;
            border-radius: 13px;
            padding: 12px;
            margin-top: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #007aff;
            color: white;
        }

        .main-button:active {
            transform: scale(0.98);
        }

        .qr-section {
            margin-top: 13px;
            padding-top: 11px;
            border-top: 1px solid #e5e5e7;
        }

        .qr-title {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 3px;
        }

        .qr-instruction {
            font-size: 11px;
            color: #6e6e73;
            line-height: 1.3;
            margin: 0 0 8px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode img {
            width: 150px !important;
            height: 150px !important;
            border-radius: 8px;
        }

        .bottom-note {
            margin-top: 8px;
            font-size: 11px;
            color: #8e8e93;
            line-height: 1.3;
        }

        @media (max-height: 700px) {

            .card {
                padding: 14px 18px;
            }

            .wifi-icon {
                font-size: 30px;
                margin-bottom: 3px;
            }

            h1 {
                font-size: 22px;
            }

            .subtitle {
                margin-bottom: 10px;
            }

            .info {
                padding: 8px 12px;
                margin-bottom: 6px;
            }

            .qr-section {
                margin-top: 9px;
                padding-top: 8px;
            }

            #qrcode img {
                width: 125px !important;
                height: 125px !important;
            }

            .bottom-note {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="wifi-icon">📶</div>

    <h1>K&K Wi-Fi</h1>

    <div class="subtitle">
        Welcome! Connect to our Wi-Fi
    </div>

    <div class="info">
        <div class="label">Wi-Fi Network</div>
        <div class="value" id="network">YOUR_WIFI_NAME</div>
    </div>

    <div class="info">
        <div class="label">Password</div>

        <div class="password-row">
            <div class="value password" id="password">
                ••••••••••••
            </div>

            <button class="small-button" onclick="togglePassword()">
                Show
            </button>
        </div>
    </div>

    <button class="main-button" onclick="copyPassword()">
        Copy Password
    </button>

    <div class="qr-section">

        <div class="qr-title">
            Long-press the QR code
        </div>

        <div class="qr-instruction">
            Then tap <strong>"Join Network"</strong>
        </div>

        <div id="qrcode"></div>

    </div>

    <div class="bottom-note">
        Or use "Copy Password" above and join from Wi-Fi settings.
    </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

    /*
     * ==========================================
     * CHANGE YOUR WI-FI INFORMATION HERE
     * ==========================================
     */

    const WIFI_NAME = "KK (2.4G)";
    const WIFI_PASSWORD = "020122K@Ki";


    /*
     * ==========================================
     * DO NOT EDIT BELOW THIS LINE
     * ==========================================
     */

    document.getElementById("network").textContent = WIFI_NAME;

    let passwordVisible = false;

    function togglePassword() {

        const passwordElement =
            document.getElementById("password");

        const button =
            document.querySelector(".small-button");

        if (passwordVisible) {

            passwordElement.textContent = "••••••••••••";
            button.textContent = "Show";
            passwordVisible = false;

        } else {

            passwordElement.textContent = WIFI_PASSWORD;
            button.textContent = "Hide";
            passwordVisible = true;

        }
    }


    function copyPassword() {

        navigator.clipboard.writeText(WIFI_PASSWORD).then(() => {

            const button =
                document.querySelector(".main-button");

            button.textContent = "✓ Password Copied";

            setTimeout(() => {
                button.textContent = "Copy Password";
            }, 2000);

        });

    }


    /*
     * Generate Wi-Fi QR code
     */

    const wifiQR =
        `WIFI:T:WPA;S:${WIFI_NAME};P:${WIFI_PASSWORD};;`;

    new QRCode(document.getElementById("qrcode"), {
        text: wifiQR,
        width: 150,
        height: 150,
        correctLevel: QRCode.CorrectLevel.M
    });

</script>

</body>
</html>
